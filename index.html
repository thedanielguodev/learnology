<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Learnology</title>
<meta name="description" content="Learn the language of your own health. Bite-size health and medical literacy lessons in English, Spanish and Chinese.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=Figtree:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f1e7;--ink:#17332b;--muted:#5b6f67;--card:#fffdf8;--line:#ddd5c3;--green:#1f6f54;--green-d:#14503c;--coral:#e4572e;--coral-d:#b83f1c;--sun:#f2b84b;--sun-d:#c28f26;--blue:#3d6b8c;--blue-d:#2b4d66;--ok:#1f6f54;--bad:#b3341b;--lock:#cfc7b4;--lock-d:#b3ab97}
@media (prefers-color-scheme:dark){:root{--bg:#10201b;--ink:#eee8da;--muted:#9fb3aa;--card:#172a24;--line:#2c443b;--green:#3f9c78;--green-d:#2a7456;--coral:#ff7a50;--coral-d:#c95530;--ok:#7fd1ad;--bad:#ff8f77;--lock:#2c443b;--lock-d:#223731}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 Figtree,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:Fraunces,Georgia,serif;line-height:1.1;margin:0}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
a{color:inherit}
.btn{display:inline-block;background:var(--green);color:#fff;border:0;border-radius:12px;padding:13px 22px;font:800 15px Figtree,sans-serif;letter-spacing:.04em;text-transform:uppercase;cursor:pointer;text-decoration:none;box-shadow:0 4px 0 var(--green-d);transition:transform .08s,box-shadow .08s;text-align:center}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--green-d)}
.btn:disabled{background:var(--lock);color:var(--muted);box-shadow:0 4px 0 var(--lock-d);cursor:not-allowed}
.btn.coral{background:var(--coral);box-shadow:0 4px 0 var(--coral-d)}
.btn.sun{background:var(--sun);color:#17332b;box-shadow:0 4px 0 var(--sun-d)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.btn.block{display:block;width:100%}
.logo{font:800 28px Fraunces,serif;text-decoration:none;letter-spacing:-.5px}.logo b{color:var(--coral)}
/* auth */
.auth{min-height:100vh;display:grid;grid-template-columns:1fr 1fr}
.auth-l{background:var(--green);color:#fff;padding:40px;display:flex;flex-direction:column;justify-content:space-between}
.auth-l .logo{color:#fff}
.auth-l h1{font-size:clamp(36px,4.6vw,60px);font-weight:800;letter-spacing:-1.2px;max-width:11em}
.auth-l h1 em{font-style:normal;color:var(--sun)}
.auth-l p{max-width:26em;opacity:.9;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.chips span{background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.3);border-radius:12px;padding:8px 14px;font:600 20px Fraunces,serif}
.auth-r{display:flex;align-items:center;justify-content:center;padding:32px}
.form{width:100%;max-width:380px}
.form h2{font-size:32px;margin-bottom:18px}
.form label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.form input{width:100%;padding:13px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:500 17px Figtree,sans-serif}
.form input:focus{border-color:var(--green);outline:none}
.err{color:var(--bad);font-weight:600;min-height:24px;margin:10px 0 2px;font-size:15px}
.swap{margin-top:16px;text-align:center;color:var(--muted);font-size:15px}
.swap button{background:none;border:0;color:var(--blue);font-weight:800;cursor:pointer;text-decoration:underline;font-size:15px}
.fine{font-size:13px;color:var(--muted);margin-top:14px;text-align:center}
.lang-pick{position:absolute;top:16px;right:20px}
select{font:600 15px Figtree,sans-serif;padding:7px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink)}
/* shell */
.shell{display:grid;grid-template-columns:230px minmax(0,1fr) 300px;min-height:100vh;max-width:1180px;margin:0 auto}
.side{padding:24px 14px;position:sticky;top:0;height:100vh;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:6px}
.side .logo{padding:0 12px 18px}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;text-decoration:none;font:800 14px Figtree;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border:2px solid transparent}
.nav a:hover{background:var(--card)}
.nav a.on{background:color-mix(in srgb,var(--green) 14%,var(--bg));border-color:var(--green);color:var(--green)}
.nav i{font-style:normal;font-size:20px;width:26px;text-align:center}
.main{padding:24px 24px 100px;min-width:0}
.rail{padding:24px 20px;position:sticky;top:0;height:100vh;overflow:auto}
.stats{display:flex;gap:8px;justify-content:space-between;margin-bottom:18px}
.stat{font:800 17px Figtree;display:flex;gap:6px;align-items:center}
.stat.s{color:var(--coral)}.stat.x{color:var(--sun-d)}.stat.h{color:var(--bad)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.card h3{font-size:20px;margin-bottom:6px}
.card p{margin:0 0 12px;color:var(--muted);font-size:15px}
.tabs-m{display:none}
/* path */
.unit{border-radius:16px;padding:16px 20px;color:#fff;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.unit h2{font-size:24px}.unit p{margin:2px 0 0;opacity:.92;font-size:15px}
.unit .tag{font:800 12px Figtree;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.u0{background:var(--green)}.u1{background:var(--coral)}.u2{background:var(--blue)}.u3{background:#7a3b69}.u1,.u2{}
.sunbg{background:var(--sun);color:#17332b}
.pathcol{display:flex;flex-direction:column;align-items:center;padding:22px 0 30px}
.node{position:relative;width:76px;height:70px;border-radius:50%;border:0;margin:10px 0;font:800 26px Fraunces,serif;cursor:pointer;color:#fff;background:var(--c);box-shadow:0 7px 0 var(--cd);transition:transform .08s,box-shadow .08s}
.node:active:not(:disabled){transform:translateY(5px);box-shadow:0 2px 0 var(--cd)}
.node:disabled{background:var(--lock);--cd:var(--lock-d);color:var(--muted);cursor:not-allowed;box-shadow:0 7px 0 var(--lock-d)}
.node.cur::after{content:"START";position:absolute;top:-34px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--green);border:2px solid var(--line);border-radius:10px;padding:2px 10px;font:800 13px Figtree;letter-spacing:.06em;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translate(-50%,-5px)}}
.nlabel{font-weight:700;font-size:14px;color:var(--muted);margin-top:-2px}
/* lesson */
.lesson{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10}
.ltop{display:flex;align-items:center;gap:16px;max-width:760px;width:100%;margin:0 auto;padding:18px 20px}
.x{background:none;border:0;font-size:28px;color:var(--muted);cursor:pointer;line-height:1}
.prog{flex:1;height:16px;background:var(--line);border-radius:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .3s;width:0}
.lbody{flex:1;overflow:auto;max-width:760px;width:100%;margin:0 auto;padding:10px 20px 30px}
.lbody h2{font-size:clamp(26px,4vw,34px);margin:10px 0 24px}
.opts{display:grid;gap:12px}
.opt{display:flex;gap:14px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:14px 16px;font:600 18px Figtree;cursor:pointer}
.opt kbd{font:800 13px Figtree;border:2px solid var(--line);border-radius:8px;width:28px;height:28px;display:grid;place-items:center;color:var(--muted);flex:none}
.opt:hover:not(:disabled){background:color-mix(in srgb,var(--blue) 8%,var(--card))}
.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 14%,var(--card))}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 16%,var(--card))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.match .opt{justify-content:center;text-align:center;font-size:16px}
.opt.gone{visibility:hidden}
.lbar{border-top:2px solid var(--line);padding:18px 20px calc(18px + env(safe-area-inset-bottom))}
.lbar.ok{background:color-mix(in srgb,var(--ok) 18%,var(--bg))}.lbar.bad{background:color-mix(in srgb,var(--bad) 16%,var(--bg))}
.lbar>div{max-width:760px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.lbar .fb{flex:1;min-width:200px}.fb b{display:block;font:800 22px Fraunces,serif}
.lbar.ok .fb{color:var(--ok)}.lbar.bad .fb{color:var(--bad)}.fb span{display:block;color:var(--ink);font-size:15px;font-weight:500}
.lbar .btn{min-width:160px}
.hearts{font-weight:800;color:var(--bad)}
.center{text-align:center;max-width:460px;margin:8vh auto 0}
.center h1{font-size:40px;margin-bottom:10px}
.big{display:flex;gap:14px;justify-content:center;margin:24px 0}
.big div{border:2px solid var(--line);border-radius:14px;padding:12px 18px;min-width:110px;background:var(--card)}
.big b{display:block;font:800 26px Fraunces}.big small{color:var(--muted);font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.06em}
/* pages */
.page h1{font-size:34px;margin-bottom:6px}
.sub{color:var(--muted);margin:0 0 22px}
.moods{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.moods button{background:var(--card);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:12px 18px;font:700 16px Figtree;cursor:pointer}
.moods button[aria-pressed=true]{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 14%,var(--card))}
.reply{border-left:5px solid var(--coral);background:var(--card);border-radius:0 14px 14px 0;padding:16px 18px;max-width:560px}
.note{font-size:14px;color:var(--muted);max-width:560px;margin-top:14px}
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin-top:8px}
.plan{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:8px}
.plan.best{border-color:var(--coral);position:relative}
.plan.best::before{content:attr(data-badge);position:absolute;top:-13px;left:18px;background:var(--coral);color:#fff;border-radius:8px;padding:2px 10px;font:800 12px Figtree;letter-spacing:.06em;text-transform:uppercase}
.plan h3{font-size:24px}.price{font:800 38px Fraunces}.price small{font:600 15px Figtree;color:var(--muted)}
.plan ul{list-style:none;padding:0;margin:6px 0 10px;flex:1}
.plan li{padding:5px 0 5px 24px;position:relative;font-size:15.5px}
.plan li::before{content:"✓";position:absolute;left:0;color:var(--green);font-weight:800}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center;z-index:30;padding:20px}
.modal>div{background:var(--card);border-radius:18px;padding:26px;max-width:400px;width:100%}
.modal h3{font-size:26px;margin-bottom:8px}
.modal .acts{display:flex;gap:10px;margin-top:18px}.modal .acts .btn{flex:1}
.plus{background:var(--sun);color:#17332b;border-radius:6px;padding:1px 8px;font:800 12px Figtree;letter-spacing:.06em;text-transform:uppercase;vertical-align:middle}
@media(max-width:1020px){.shell{grid-template-columns:200px minmax(0,1fr)}.rail{display:none}}
@media(max-width:720px){
 .auth{grid-template-columns:1fr}.auth-l{padding:26px;gap:24px}.auth-l h1{font-size:34px}.chips{display:none}.lang-pick{position:static;margin-bottom:10px}
 .shell{display:block}.side{display:none}.main{padding:14px 16px 96px}
 .tabs-m{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
 .tabs-m a{flex:1;text-align:center;padding:10px 0 8px;text-decoration:none;font:800 11px Figtree;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
 .tabs-m a i{display:block;font-style:normal;font-size:22px}.tabs-m a.on{color:var(--green)}
 .topstats{display:flex!important}
 .match{gap:8px}
}
.topstats{display:none;justify-content:space-between;padding:4px 2px 14px}

.land{overflow-x:hidden}
.lh{display:flex;justify-content:space-between;align-items:center;max-width:1040px;margin:0 auto;padding:18px 20px}
.btn.sm{padding:9px 16px;font-size:13px}
.hero{max-width:1040px;margin:0 auto;padding:56px 20px 64px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(44px,7vw,84px);font-weight:800;letter-spacing:-2px}
.hero h1 em{font-style:normal;color:var(--coral)}
.hero p{font-size:20px;color:var(--muted);max-width:28em;margin:20px 0 28px}
.words{display:flex;flex-wrap:wrap;gap:10px}
.words span{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 16px;font:600 22px Fraunces,serif}
.words span small{display:block;font:500 13px Figtree,sans-serif;color:var(--muted)}
.words span:nth-child(2n){transform:rotate(-2deg)}.words span:nth-child(3n){transform:rotate(2deg);background:var(--sun);color:#17332b;border-color:#17332b}.words span:nth-child(3n) small{color:#4b4220}
.pts{max-width:1040px;margin:0 auto;padding:0 20px 64px;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pts div{border-top:5px solid var(--coral);padding-top:10px}.pts b{font:800 28px Fraunces,serif;color:var(--coral)}.pts p{margin:2px 0 0;font-weight:600}
.try{border-top:2px solid var(--line);padding:64px 20px;background:color-mix(in srgb,var(--sun) 12%,var(--bg))}
.trywrap{max-width:640px;margin:0 auto}
.trywrap h2{font-size:clamp(30px,4.6vw,46px);margin:10px 0 6px;letter-spacing:-.8px}
.qcard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px}
.qcard h3{font-size:26px;margin:10px 0 16px}
.qdots{display:flex;gap:8px;align-items:center}.qdots i{width:34px;height:10px;border-radius:5px;background:var(--line)}.qdots i.on{background:var(--green)}.qdots i.cur{background:var(--blue)}.qdots .stat{margin-left:auto}
.qfb{margin-top:16px;border-radius:12px;padding:14px 16px}.qfb.ok{background:color-mix(in srgb,var(--ok) 16%,var(--card))}.qfb.bad{background:color-mix(in srgb,var(--bad) 14%,var(--card))}
.qfb b{font:800 20px Fraunces,serif;margin-right:6px}
.center2{text-align:center;padding:10px 0}.center2 h3{margin:6px 0}
.join{background:var(--green);padding:64px 20px;display:flex;justify-content:center}
.join .form{background:var(--card);border-radius:18px;padding:28px;max-width:420px}
.lf{text-align:center;padding:24px;font-size:14px}.lf a{color:var(--muted)}
@media(max-width:720px){.hero{grid-template-columns:1fr;padding-top:24px}.pts{grid-template-columns:1fr}}

.wizard{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:22px}
.wizard h3{font-size:28px;margin:18px 0 4px}
.steps{display:flex;align-items:center;gap:8px}
.sd{display:flex;align-items:center;gap:8px;font:700 14px Figtree;color:var(--muted)}
.sd b{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);font:800 14px Figtree}
.sd.cur{color:var(--ink)}.sd.cur b{background:var(--coral);color:#fff}.sd.on b{background:var(--green);color:#fff}
.sl{flex:1;height:3px;background:var(--line);border-radius:2px;min-width:12px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-top:14px}
.cards.two{grid-template-columns:1fr 1fr}
.pick{text-align:left;background:var(--bg);border:2px solid var(--line);border-bottom-width:5px;border-radius:14px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
.pick b{font:700 20px Fraunces,serif}.pick small{color:var(--muted);font-size:14px;line-height:1.35}
.pick:hover{border-color:var(--green)}.pick[aria-pressed=true]{border-color:var(--coral);background:color-mix(in srgb,var(--coral) 12%,var(--card))}
.wnav{display:flex;justify-content:space-between;align-items:center;margin-top:20px}
.chipline{font-weight:700;color:var(--green);margin:0 0 6px}
@media(max-width:560px){.sd span{display:none}.cards.two{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const day=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00')-new Date(a+'T00:00'))/864e5);
async function hash(pw,salt){const b=new TextEncoder().encode(salt+':'+pw);const h=await crypto.subtle.digest('SHA-256',b);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}

let LS=null;
function startLesson(id){
  const les=LESSONS.find(l=>l.id===id);if(!les){location.hash='#/learn';return}
  const qs=les.qs.map(q=>{
    if(q.t==='mc'){const d=q[L()],opts=d.slice(1,4);const order=shuffle([0,1,2]);return {t:'mc',q:d[0],opts:order.map(i=>opts[i]),a:order.indexOf(q.a),e:d[4],asked:0}}
    const pairs=q[L()];return {t:'match',pairs,asked:0};
  });
  LS={les,queue:qs,total:qs.length,hearts:isPlus()?Infinity:3,mistakes:0,state:'ask',sel:null,m:null};
  drawLesson();
}
function lessonFrame(body,bar){
  const pct=Math.round((LS.total-LS.queue.length)/LS.total*100);
  app.innerHTML=`<div class="lesson"><div class="ltop"><button class="x" id="qx" aria-label="Close">×</button><div class="prog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><i style="width:${pct}%"></i></div><span class="hearts">❤ ${LS.hearts===Infinity?'∞':LS.hearts}</span></div><div class="lbody">${body}</div>${bar}</div>`;
  $('#qx').onclick=()=>{if(confirm(t('quit')))location.hash='#/learn'};
}
function drawLesson(){
  if(LS.hearts<=0)return failScreen();
  if(!LS.queue.length)return finishLesson();
  const q=LS.queue[0];
  if(q.t==='mc'){
    const body=`<h2>${esc(q.q)}</h2><div class="opts">${q.opts.map((o,i)=>`<button class="opt ${LS.sel===i?'sel':''}" data-i="${i}"><kbd>${i+1}</kbd>${esc(o)}</button>`).join('')}</div>`;
    lessonFrame(body,`<div class="lbar"><div><span></span><button class="btn" id="ck" ${LS.sel==null?'disabled':''}>${t('check')}</button></div></div>`);
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{LS.sel=+b.dataset.i;drawLesson()});
    $('#ck').onclick=checkMC;
  }else{
    if(!LS.m){LS.m={L:shuffle(q.pairs.map((p,i)=>[i,p[0]])),R:shuffle(q.pairs.map((p,i)=>[i,p[1]])),sel:null,gone:new Set(),bad:null}}
    const m=LS.m,all=m.gone.size===q.pairs.length;
    const col=(arr,side)=>arr.map(([i,txt])=>`<button class="opt ${m.gone.has(i)?'gone':''} ${m.sel&&m.sel.side===side&&m.sel.i===i?'sel':''} ${m.bad&&m.bad.side===side&&m.bad.i===i?'wrong':''}" data-s="${side}" data-i="${i}">${esc(txt)}</button>`).join('');
    const body=`<h2>${t('matchQ')}</h2><div class="match"><div class="opts">${col(m.L,'L')}</div><div class="opts">${col(m.R,'R')}</div></div>`;
    lessonFrame(body,all?`<div class="lbar ok"><div><div class="fb"><b>${t('correct')}</b></div><button class="btn" id="nx">${t('next')}</button></div></div>`:`<div class="lbar"><div><span></span><button class="btn" disabled>${t('check')}</button></div></div>`);
    if(all)$('#nx').onclick=()=>{LS.queue.shift();LS.m=null;drawLesson()};
    document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>matchTap(b.dataset.s,+b.dataset.i,q));
  }
}
function matchTap(side,i,q){
  const m=LS.m;m.bad=null;
  if(!m.sel||m.sel.side===side){m.sel={side,i};return drawLesson()}
  const a=m.sel.side==='L'?m.sel.i:i,b=m.sel.side==='L'?i:m.sel.i;
  if(a===b){m.gone.add(a);m.sel=null}
  else{LS.hearts--;LS.mistakes++;m.bad={side,i};m.sel=null}
  drawLesson();
}
function checkMC(){
  const q=LS.queue[0],good=LS.sel===q.a;
  const body=`<h2>${esc(q.q)}</h2><div class="opts">${q.opts.map((o,i)=>`<button class="opt ${i===q.a?'right':(i===LS.sel?'wrong':'')}" disabled><kbd>${i+1}</kbd>${esc(o)}</button>`).join('')}</div>`;
  if(!good){LS.hearts--;LS.mistakes++}
  lessonFrame(body,`<div class="lbar ${good?'ok':'bad'}"><div><div class="fb"><b>${good?t('correct'):t('wrong')}</b><span>${good?'':t('answer')+' '+esc(q.opts[q.a])+'. '}${esc(q.e)}</span></div><button class="btn ${good?'':'coral'}" id="nx">${t('next')}</button></div></div>`);
  $('#nx').focus();
  $('#nx').onclick=()=>{LS.queue.shift();if(!good)LS.queue.push(q);LS.sel=null;drawLesson()};
}
document.addEventListener('keydown',e=>{
  if(!LS||!document.querySelector('.lesson'))return;
  if(['1','2','3'].includes(e.key)&&document.querySelector('.opt:not(:disabled)')&&LS.queue[0]&&LS.queue[0].t==='mc'&&!document.querySelector('.lbar.ok,.lbar.bad')){LS.sel=+e.key-1;drawLesson()}
  if(e.key==='Enter'){const b=$('#ck:not(:disabled)')||$('#nx')||$('#rt');if(b){e.preventDefault();b.click()}}
});
function failScreen(){
  app.innerHTML=`<div class="lesson"><div class="lbody"><div class="center"><div style="font-size:64px">💔</div><h1>${t('fail')}</h1><p class="sub">${t('failsub')}</p><button class="btn block" id="rt">${t('retry')}</button><p style="margin-top:14px"><a href="#/learn">${t('learn')}</a></p></div></div></div>`;
  $('#rt').onclick=()=>startLesson(LS.les.id);
}
function finishLesson(){
  const first=!P.done[LS.les.id];
  const xp=(first?15:5)+(LS.mistakes===0?5:0);
  const today=day();
  if(P.last!==today){const d=P.last?daysBetween(P.last,today):99;P.streak=(d===1||(d===2&&isPlus()))?P.streak+1:1;P.last=today}
  P.xp+=xp;P.done[LS.les.id]=true;save();
  const acc=Math.max(0,Math.round(100*LS.total/(LS.total+LS.mistakes)));
  app.innerHTML=`<div class="lesson"><div class="lbody"><div class="center"><div style="font-size:64px">🎉</div><h1>${t('done')}</h1>
   <div class="big"><div><b>⚡ ${xp}</b><small>${t('xp')}</small></div><div><b>🔥 ${P.streak}</b><small>${t('streak')}</small></div><div><b>${acc}%</b><small>${t('acc')}</small></div></div>
   <button class="btn block" id="rt">${t('next')}</button></div></div></div>`;
  $('#rt').onclick=()=>{LS=null;location.hash='#/learn'};
}

/* ---------- mind ---------- */
function renderMind(){
  shell('mind',`<div class="page"><h1>${t('mindT')}</h1><p class="sub">${t('mindS')}</p>
   <div class="moods" id="mo" role="group">${Object.keys(MOODS).map(k=>`<button data-m="${k}" aria-pressed="false">${T(MOODS[k])}</button>`).join('')}</div>
   <div class="reply" id="rp">…</div><p class="note">${t('crisis')}</p></div>`);
  document.querySelectorAll('#mo button').forEach(b=>b.onclick=()=>{
    document.querySelectorAll('#mo button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    $('#rp').textContent=T(REPLY[b.dataset.m]);
  });
}

/* ---------- plans ---------- */
let bill='yearly';
function renderPlans(){
  const price=bill==='yearly'?['$39.99',t('yr')]:['$4.99',t('mo')];
  shell('plans',`<div class="page"><h1>${t('plansT')}</h1><p class="sub">${t('plansS')}</p>
   <div class="moods" role="group"><button data-b="monthly" aria-pressed="${bill==='monthly'}">${t('monthly')}</button><button data-b="yearly" aria-pressed="${bill==='yearly'}">${t('yearly')}</button></div>
   <div class="plans">
    <div class="plan"><h3>${t('free')}</h3><div class="price">$0</div><ul><li>${t('f1')}</li><li>${t('f2')}</li><li>${t('f3')}</li></ul>
      <button class="btn ghost" disabled>${isPlus()?t('free'):t('cur')}</button></div>
    <div class="plan best" data-badge="${t('bestv')}"><h3>${t('plus')}</h3><div class="price">${price[0]}<small>${price[1]}</small></div><ul><li>${t('p1')}</li><li>${t('p2')}</li><li>${t('p3')}</li><li>${t('p4')}</li></ul>
      ${isPlus()?`<button class="btn ghost" id="cancel">${t('manage')}</button>`:`<button class="btn coral" id="up">${t('upgrade')}</button>`}</div>
    <div class="plan"><h3>${t('school')}</h3><div class="price" style="font-size:28px">Custom</div><ul><li>${t('s1')}</li><li>${t('s2')}</li><li>${t('s3')}</li></ul>
      <a class="btn ghost" href="mailto:hello@learnology.example">${t('contact')}</a></div>
   </div><p class="note">${t('demo')}</p></div>`);
  document.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{bill=b.dataset.b;renderPlans()});
  const up=$('#up');if(up)up.onclick=()=>{
    const m=document.createElement('div');m.className='modal';m.innerHTML=`<div role="dialog" aria-modal="true"><h3>${t('coT')}</h3><p>${t('plus')} · ${price[0]}${price[1]}</p><p class="sub">${t('coS')}</p><div class="acts"><button class="btn ghost" id="mn">${t('coNo')}</button><button class="btn coral" id="my">${t('coOk')}</button></div></div>`;
    document.body.appendChild(m);$('#my').focus();
    $('#mn').onclick=()=>m.remove();
    $('#my').onclick=()=>{P.plan='plus';save();m.remove();renderPlans()};
  };
  const c=$('#cancel');if(c)c.onclick=()=>{P.plan='free';save();renderPlans()};
}

/* ---------- profile ---------- */
function renderMe(){
  shell('me',`<div class="page"><h1>${esc(P.name)} ${isPlus()?'<span class="plus">Plus</span>':''}</h1><p class="sub">${esc(SESS.email)}</p>
   <div class="card">
    <div class="row"><span>${t('lessonsDone')}</span><b>${doneCount()}/${LESSONS.length}</b></div>
    <div class="row"><span>${t('total')}</span><b>${P.xp}</b></div>
    <div class="row"><span>${t('streak')}</span><b>${curStreak()}</b></div>
    <div class="row"><span>${t('plan')}</span><b>${isPlus()?t('plus'):t('free')}</b></div>
    <div class="row"><span>${t('member')}</span><b>${esc(P.joined||'')}</b></div>
    <div class="row"><span>${t('lang')}</span><select id="pl"><option value="en">English</option><option value="es">Español</option><option value="zh">中文</option></select></div>
   </div>
   <div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn ghost" id="so">${t('signout')}</button><button class="btn ghost" id="rs">${t('reset')}</button></div>
   <p class="note"><a href="about.html">${t('about')}</a></p></div>`);
  $('#pl').value=P.lang;
  $('#pl').onchange=e=>{P.lang=e.target.value;store.set('lg:lang',P.lang);save();route()};
  $('#so').onclick=()=>{store.set('lg:session',null);SESS=null;P=null;location.hash='';route()};
  $('#rs').onclick=()=>{if(confirm(t('resetQ'))){P.xp=0;P.streak=0;P.last='';P.done={};save();location.hash='#/learn';route()}};
}

/* ---------- boot ---------- */
if(SESS){loadProfile();if(!P){SESS=null}}
route();
</script>
